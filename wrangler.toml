# LOCAL DEVELOPMENT ONLY — `wrangler pages dev dist`.
#
# Deliberately WITHOUT `pages_build_output_dir`. Adding that key would make
# this file authoritative for `wrangler pages deploy`, and Pages would then
# deploy "whatever configuration was defined for local use" — silently
# dropping the dashboard's ANALYTICS_ACCOUNT_ID and ANALYTICS_READ_TOKEN and
# leaving /admin permanently at its 503 guard.
# See https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Production config is the Cloudflare dashboard, under
# Workers & Pages → panduan-pengakuan-dosa → Settings:
#   Variables and Secrets → ANALYTICS_ACCOUNT_ID (text)
#                           ANALYTICS_READ_TOKEN (secret, Account Analytics : Read)
#   Bindings              → Analytics Engine, PDP_ANALYTICS → pdp_events

name = "panduan-pengakuan-dosa"
compatibility_date = "2026-08-01"

[[analytics_engine_datasets]]
binding = "PDP_ANALYTICS"
dataset = "pdp_events"
