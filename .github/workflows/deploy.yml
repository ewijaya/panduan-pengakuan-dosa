name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # `wrangler pages deploy dist` is a direct upload: it only picks up
      # Functions from <upload-dir>/functions. The sources live at the repo
      # root (conventional for Pages), so stage them into the build output.
      - name: Stage Pages Functions
        run: cp -r functions dist/functions

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=panduan-pengakuan-dosa --branch=main
